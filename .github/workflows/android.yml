name: Build release APK (FOSS)
on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Check build-tools version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Generate temporary keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          KS_PATH="$RUNNER_TEMP/temp-release.jks"
          KS_ALIAS="tempkey"
          KS_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair \
            -keystore "$KS_PATH" \
            -storetype PKCS12 \
            -alias "$KS_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=Temporary, OU=CI, O=CI, L=Unknown, ST=Unknown, C=VN"
          echo "::add-mask::$KS_PASS"
          echo "TEMP_KS_BASE64=$(base64 -w 0 "$KS_PATH")" >> $GITHUB_ENV
          echo "TEMP_KS_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "TEMP_KS_PASS=$KS_PASS" >> $GITHUB_ENV

      # A pull request from a fork gets no secrets, so it only checks that the APK builds.
      - uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ env.TEMP_KS_BASE64 }}
          alias: ${{ env.TEMP_KS_ALIAS }}
          keyStorePassword: ${{ env.TEMP_KS_PASS }}
          keyPassword: ${{ env.TEMP_KS_PASS }}
          zipAlign: true
        env:
            BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Upload APK
        if: steps.sign_app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: androidApp/build/outputs/apk/release/*-signed.apk

  # SimpMusic for vivo (vivoAndroidApp, com.spotify.music), same Full build as above.
  build-vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Update core submodule
        run: git submodule update --remote --merge

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build vivo release APK
        run: ./gradlew vivoAndroidApp:assembleRelease

      - name: Check build-tools version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Generate temporary keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          KS_PATH="$RUNNER_TEMP/temp-release.jks"
          KS_ALIAS="tempkey"
          KS_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair \
            -keystore "$KS_PATH" \
            -storetype PKCS12 \
            -alias "$KS_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=Temporary, OU=CI, O=CI, L=Unknown, ST=Unknown, C=VN"
          echo "::add-mask::$KS_PASS"
          echo "TEMP_KS_BASE64=$(base64 -w 0 "$KS_PATH")" >> $GITHUB_ENV
          echo "TEMP_KS_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "TEMP_KS_PASS=$KS_PASS" >> $GITHUB_ENV

      # A pull request from a fork gets no secrets, so it only checks that the APK builds.
      - uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          releaseDirectory: vivoAndroidApp/build/outputs/apk/release
          signingKeyBase64: ${{ env.TEMP_KS_BASE64 }}
          alias: ${{ env.TEMP_KS_ALIAS }}
          keyStorePassword: ${{ env.TEMP_KS_PASS }}
          keyPassword: ${{ env.TEMP_KS_PASS }}
          zipAlign: true
        env:
            BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Upload APK
        if: steps.sign_app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-vivo
          path: vivoAndroidApp/build/outputs/apk/release/*-signed.apk
